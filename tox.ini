[tox]
envlist = docs,format,mypy,py38,py39,py310,py311,py312,py313,py314,package,pep8
isolated_build = true

[testenv]
# The h2/hpack/hyperframe backports are published on the py38deps package index.
setenv =
    PIP_EXTRA_INDEX_URL = https://py38deps.github.io/py38deps/simple/
deps =
    httpx
    hypothesis
    pytest
    pytest-asyncio
    pytest-cov>=6.0.0,<7 ; python_version >= '3.9'
    pytest-cov>=5.0.0,<6 ; python_version < '3.9'
    pytest-sugar
    pytest-trio
    # Use our backports so that all python versions test against the
    # latest h2 (h2, hpack and hyperframe latest releases require higher
    # python versions than the ones supported by this project)
    h2
    hpack ; python_version < '3.10'
    hyperframe ; python_version < '3.9'
commands = pytest --cov=hypercorn {posargs}

[testenv:docs]
basepython = python3.14
deps =
    pydata-sphinx-theme
    sphinx
    sphinxcontrib-mermaid
    trio
commands =
    sphinx-apidoc -e -f -o docs/reference/source/ src/hypercorn/ src/hypercorn/protocol/quic.py src/hypercorn/protocol/h3.py
    sphinx-build -W --keep-going -b html -d {envtmpdir}/doctrees docs/ docs/_build/html/

[testenv:format]
basepython = python3.14
deps =
    black
    isort
commands =
    black --check --diff src/hypercorn/ tests/
    isort --check --diff src/hypercorn tests

[testenv:pep8]
basepython = python3.14
deps =
    flake8
    pep8-naming
    flake8-print
commands = flake8 src/hypercorn/ tests/

[testenv:mypy]
basepython = python3.14
deps =
    mypy
    pytest
    pytest-asyncio
    trio
commands =
    mypy --platform linux src/hypercorn/ tests/

[testenv:package]
basepython = python3.14
deps =
    pdm
    twine
commands =
    pdm build
    twine check dist/*
